name: Release

# Publica a release no GitHub quando uma tag vX.Y.Z é enviada. As notas vêm do CHANGELOG.md;
# o BeagleDock é distribuído apenas localmente, então não há pacotes anexados.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Conferir a tag com o package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "A tag ${GITHUB_REF_NAME} não bate com a versão ${version} do package.json." >&2
            exit 1
          fi
          echo "VERSION=${version}" >> "$GITHUB_ENV"
      - name: Extrair as notas do CHANGELOG.md
        run: |
          awk -v v="${VERSION}" '$0 ~ "^## \\["v"\\]"{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | sed '1{/^$/d}' > notes.md
          test -s notes.md || { echo "CHANGELOG.md não tem a seção ${VERSION}." >&2; exit 1; }
      - name: Criar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "A release ${GITHUB_REF_NAME} já existe; nada a fazer."
          else
            gh release create "${GITHUB_REF_NAME}" --title "BeagleDock ${VERSION}" --notes-file notes.md --verify-tag
          fi
